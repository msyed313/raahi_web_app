 <form (submit)="onSubmit($event)" novalidate>
      <p class="text-xs text-slate-500">
        Enter the 6-digit code we sent to <strong class="text-slate-700">{{ email() }}</strong>.
      </p>

      @if (error()) {
        <div class="mt-3 flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-700" role="alert">
          <app-icon name="alert" class="mt-0.5" /> <span>{{ error() }}</span>
        </div>
      }
      @if (info()) {
        <p class="mt-3 rounded-lg bg-emerald-50 px-3 py-2 text-xs text-emerald-700">{{ info() }}</p>
      }

      <label class="label mt-3" for="otp">Verification code</label>
      <input id="otp" class="input text-center text-lg font-semibold tracking-[0.5em]" inputmode="numeric"
             maxlength="6" autocomplete="one-time-code" placeholder="••••••" [formControl]="code" (input)="clean()" />

      <button type="submit" class="btn btn-accent mt-3 w-full" [disabled]="busy()">
        @if (busy()) { Verifying… } @else { Verify code }
      </button>

      <div class="mt-3 flex items-center justify-between text-xs">
        <button type="button" class="font-semibold text-navy-600 hover:underline" (click)="changeEmail.emit()">
          Use a different email
        </button>
        @if (remaining() > 0) {
          <span class="text-slate-400">Resend code in {{ remaining() }}s</span>
        } @else {
          <button type="button" class="font-semibold text-navy-600 hover:underline" [disabled]="resending()" (click)="resend()">
            Resend code
          </button>
        }
      </div>
    </form>
